# maisondufrancais.fr — application Flask (gunicorn, service maisondufrancais-web)
server {
    server_name maisondufrancais.fr;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/maisondufrancais.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maisondufrancais.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    access_log /var/www/maisondufrancais/logs/access.log;
    error_log  /var/www/maisondufrancais/logs/error.log;

    client_max_body_size 20m;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml image/svg+xml text/plain;

    location / {
        proxy_pass http://unix:/run/maisondufrancais/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # www → domaine sans www
    server_name www.maisondufrancais.fr;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/maisondufrancais.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maisondufrancais.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://maisondufrancais.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name maisondufrancais.fr www.maisondufrancais.fr;
    return 301 https://maisondufrancais.fr$request_uri;
}
