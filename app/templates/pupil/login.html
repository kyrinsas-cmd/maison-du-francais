{% extends "base.html" %}
{% block title %}{{ pup.login_h }} · {{ t.brand_main }}{% endblock %}
{% block content %}
<section class="account-page"><div class="auth-box">
  <h1>{{ pup.login_h }}</h1>
  <p class="note" style="margin:0">{{ pup.login_lead }}</p>
  <form class="form" method="post">
    {% if error %}<p class="errors" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>{{ pup.id }}<input type="text" name="login_id" required autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="MF123456" value="{{ lid }}" autofocus></label>
    <label>{{ pup.pw }}<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-navy" type="submit">{{ pup.login }}</button>
  </form>
  <p class="note" style="margin:0"><a href="{{ url_for('account_login') }}">{{ pup.parent_link }}</a></p>
</div></section>
{% endblock %}
