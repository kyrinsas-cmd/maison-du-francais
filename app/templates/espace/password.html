{% extends "espace/layout.html" %}
{% block title %}Mot de passe{% endblock %}
{% block content %}
<div class="admin-login">
  <h1>Changer de mot de passe</h1>
  {% if ok %}<p class="flash">Mot de passe modifié.</p>{% endif %}
  <form class="form" method="post">
    {% if errors %}<ul class="errors" role="alert">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Mot de passe actuel<input type="password" name="current" required autocomplete="current-password"></label>
    <label>Nouveau mot de passe (12 caractères minimum)<input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
    <label>Confirmer<input type="password" name="password2" required minlength="12" autocomplete="new-password"></label>
    <button class="btn btn-navy" type="submit">Enregistrer</button>
  </form>
</div>
{% endblock %}
