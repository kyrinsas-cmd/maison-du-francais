<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Espace professeur{% endblock %} · Maison du français</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}?v=8">
</head>
<body class="admin">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ url_for('espace.home') if espace_user() else '/fr/' }}">
      <img src="{{ url_for('static', filename='img/logo-icon.png') }}" alt="" width="40" height="40" style="width:40px;height:40px">
      <span class="brand-name"><b>Espace professeur</b><span>Maison du français</span></span>
    </a>
    {% if espace_user() %}
    <nav class="nav" aria-label="Espace professeur">
      <a href="{{ url_for('espace.home') }}">Mon espace</a>
      <a href="{{ url_for('espace.profile') }}">Mon profil</a>
      <a href="{{ url_for('espace.password') }}">Mot de passe</a>
      <form method="post" action="{{ url_for('espace.logout') }}" style="margin:0">
        <input type="hidden" name="csrf" value="{{ csrf() }}">
        <button class="btn btn-line btn-small" type="submit">Déconnexion</button>
      </form>
    </nav>
    {% else %}
    <nav class="nav"><a href="/fr/">Retour au site</a></nav>
    {% endif %}
  </div>
</header>
<main class="wrap admin-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
