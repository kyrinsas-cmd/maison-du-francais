{% extends "compte/layout.html" %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block content %}
<h1>Nouveau mot de passe</h1>
<p>Compte : <b>{{ u.email }}</b></p>
<form class="form" method="post">
  {% if errors %}<ul class="errors" role="alert">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <input type="text" name="username" value="{{ u.email }}" autocomplete="username" hidden>
  <label>Nouveau mot de passe (12 caractères minimum)<input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
  <label>Confirmer<input type="password" name="password2" required minlength="12" autocomplete="new-password"></label>
  <button class="btn btn-navy" type="submit">Enregistrer et me connecter</button>
</form>
{% endblock %}
