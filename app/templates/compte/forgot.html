{% extends "base.html" %}
{% block title %}{{ t.ac_forgot_title }} · {{ t.brand_main }}{% endblock %}
{% block content %}
<section class="account-page"><div class="auth-box">
  <h1>{{ t.ac_forgot_title }}</h1>
  {% if sent %}<p class="flash">{{ t.ac_forgot_sent }}</p>
  {% else %}
  <form class="form" method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>{{ t.ac_email }}<input type="email" name="email" required autocomplete="username" autofocus></label>
    <button class="btn btn-navy" type="submit">{{ t.ac_forgot_btn }}</button>
  </form>
  {% endif %}
  <p><a href="{{ url_for('account_login') }}">← {{ t.ac_login_title }}</a></p>
</div></section>
{% endblock %}
