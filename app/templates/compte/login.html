{% extends "base.html" %}
{% block title %}{{ t.ac_login_title }} · {{ t.brand_main }}{% endblock %}
{% block content %}
<section class="account-page"><div class="auth-box">
  <h1>{{ t.ac_login_title }}</h1>
  <form class="form" method="post">
    {% if error %}<p class="errors" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>{{ t.ac_email }}<input type="email" name="email" required autocomplete="username" value="{{ email }}" autofocus></label>
    <label>{{ t.ac_password }}<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-navy" type="submit">{{ t.ac_login_btn }}</button>
    <p class="note" style="margin:0"><a href="{{ url_for('account_forgot') }}">{{ t.ac_forgot_link }}</a></p>
  </form>
  <div class="card account-alt"><p style="margin:0">{{ t.ac_no_account }}</p><a class="btn btn-red btn-small" href="{{ url_for('account_signup') }}">{{ t.ac_signup_link }}</a></div>
</div></section>
{% endblock %}
