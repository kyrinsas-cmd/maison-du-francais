{% extends "compte/layout.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<h1>Connexion</h1>
<form class="form" method="post">
  {% if error %}<p class="errors" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>E-mail<input type="email" name="email" required autocomplete="username" value="{{ email }}" autofocus></label>
  <label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn btn-navy" type="submit">Se connecter</button>
  <p class="note" style="margin:0"><a href="{{ url_for('compte.forgot') }}">Mot de passe oublié ?</a> · <a href="{{ url_for('compte.signup') }}">Créer un compte</a></p>
</form>
<p class="note">Vous êtes professeur ? Votre espace est ici : <a href="{{ url_for('espace.login') }}">Espace professeur</a>.</p>
{% endblock %}
