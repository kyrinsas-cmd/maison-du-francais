{% extends "base.html" %}
{% from "compte/_box.html" import errs %}
{% block title %}{{ t.ac_change_pw }} · {{ t.brand_main }}{% endblock %}
{% block content %}
<section class="account-page"><div class="account-box">
  <h1>{{ t.ac_change_pw }}</h1>
  {% if ok %}<p class="flash">{{ t.ac_pw_changed }}</p>{% endif %}
  <form class="form" method="post">
    {{ errs(errors) }}
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>{{ t.ac_current_pw }}<input type="password" name="current" required autocomplete="current-password"></label>
    <label>{{ t.ac_password_new }}<input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
    <label>{{ t.ac_password2 }}<input type="password" name="password2" required minlength="12" autocomplete="new-password"></label>
    <button class="btn btn-navy" type="submit">{{ t.ac_save }}</button>
  </form>
  <p><a href="{{ url_for('account_home') }}">← {{ t.ac_home_title }}</a></p>
</div></section>
{% endblock %}
